; PlatformIO Project Configuration File
;
; 潛水艇 (ROV) 端韌體 — GOOUUU ESP32-S3-CAM N16R8
; 主板與 Freenove ESP32-S3 接腳相容（doc/05 相機接腳沿用）
; 16MB Flash / 8MB OPI PSRAM / 含 OV5640 相機
;
; https://docs.platformio.org/page/projectconf.html

[env:goouuu_esp32s3cam]
; 使用 pioarduino 平台分支（內含 Arduino-ESP32 core 3.x）。
; 官方 espressif32 仍停在 core 2.0.x，無 ledcAttach(pin) / esp_now_recv_info_t 等
; 本專案（依 doc 為 core 3.x 撰寫）所需 API。
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

; --- Flash / PSRAM（doc/03 必要設定）---
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = huge_app.csv          ; Huge APP 3MB（doc/03）
board_build.arduino.memory_type = qio_opi      ; OPI PSRAM（doc/03 選錯相機無法啟動）

monitor_speed = 115200

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1                 ; USB CDC On Boot：釋放 GPIO43/44（doc/03）
    -DCORE_DEBUG_LEVEL=3

lib_deps =
    adafruit/Adafruit MCP23017 Arduino Library
    adafruit/Adafruit INA260 Library
    adafruit/Adafruit QMC5883P Library
    bluerobotics/BlueRobotics MS5837 Library
    mikalhart/TinyGPSPlus
    dlloydev/QuickPID
    bblanchon/ArduinoJson
; 註：MJPEG 串流改用 ESP-IDF 內建 esp_http_server（最穩定、CameraWebServer 同款做法），
;     ROV 端不需 ESPAsyncWebServer/AsyncTCP（那是地面站 WebSocket 用）。

; 單機測試環境：手邊無地面站時用此環境燒錄，ROV 會自開 SoftAP（SSID: ROV_TEST），
; 手機連上後瀏覽器開 http://192.168.4.1/ 即可看相機即時影像、測感測器。
; 燒錄： pio run -e standalone -t upload
[env:standalone]
extends = env:goouuu_esp32s3cam
build_flags =
    ${env:goouuu_esp32s3cam.build_flags}
    -DSTANDALONE_TEST=1
