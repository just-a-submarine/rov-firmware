; PlatformIO Project Configuration File
; ROV 潛水艇專案 — 地面站（Ground Station）ESP32-S3
; 職責：Wi-Fi AP、WebSocket 遙測、HTTP 航點、ESP-NOW 轉發、Xbox 手把（藍牙 Bluepad32）
; 不負責影像（手機 <img> 直連 ROV 192.168.4.100）
;
; ⚠ 必須用原生 PowerShell 建置（非 MSYS/Git-Bash），否則 idf_tools.py 會拒跑。
; 平台釘 54.03.21-2（54.03.21 的工具鏈對 esp_lcd 有編譯器 ICE，-2 已修）。

[platformio]
src_dir = main

[env:groundstation]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21-2/platform-espressif32.zip
framework = espidf
board = esp32-s3-devkitc-1

monitor_speed = 115200
upload_port = COM4
monitor_port = COM4

board_build.filesystem = littlefs
board_build.partitions = partitions.csv

; arduino core 3.x 依賴 esp_insights/esp_rainmaker，需嵌入其憑證檔
board_build.embed_txtfiles =
	managed_components/espressif__esp_insights/server_certs/https_server.crt
	managed_components/espressif__esp_rainmaker/server_certs/rmaker_mqtt_server.crt
	managed_components/espressif__esp_rainmaker/server_certs/rmaker_claim_service_server.crt
	managed_components/espressif__esp_rainmaker/server_certs/rmaker_ota_server.crt
